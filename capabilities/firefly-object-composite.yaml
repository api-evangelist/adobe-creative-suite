naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Firefly API — Object Composite
  description: 'Adobe Creative Suite Adobe Firefly API — Object Composite. 1 operations. Lead operation: Adobe Creative Suite
    Generate Object Composite. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Object Composite
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: firefly-object-composite
    baseUri: https://firefly-api.adobe.io/v3
    description: Adobe Creative Suite Adobe Firefly API — Object Composite business capability. Self-contained, no shared
      references.
    resources:
    - name: images-generate-object-composite-async
      path: /images/generate-object-composite-async
      operations:
      - name: generateobjectcompositeasync
        method: POST
        description: Adobe Creative Suite Generate Object Composite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: firefly-object-composite-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Firefly API — Object Composite. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/images/generate-object-composite-async
      name: images-generate-object-composite-async
      description: REST surface for images-generate-object-composite-async.
      operations:
      - method: POST
        name: generateobjectcompositeasync
        description: Adobe Creative Suite Generate Object Composite
        call: firefly-object-composite.generateobjectcompositeasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: firefly-object-composite-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Firefly API — Object Composite. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-generate-object
      description: Adobe Creative Suite Generate Object Composite
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firefly-object-composite.generateobjectcompositeasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
