naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Photoshop API — Document
  description: 'Adobe Creative Suite Adobe Photoshop API — Document. 1 operations. Lead operation: Adobe Creative Suite Apply
    Document Operations. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Document
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoshop-document
    baseUri: https://image.adobe.io
    description: Adobe Creative Suite Adobe Photoshop API — Document business capability. Self-contained, no shared references.
    resources:
    - name: pie-psdService-documentOperations
      path: /pie/psdService/documentOperations
      operations:
      - name: applydocumentoperations
        method: POST
        description: Adobe Creative Suite Apply Document Operations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: photoshop-document-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Photoshop API — Document. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/pie/psdservice/documentoperations
      name: pie-psdservice-documentoperations
      description: REST surface for pie-psdService-documentOperations.
      operations:
      - method: POST
        name: applydocumentoperations
        description: Adobe Creative Suite Apply Document Operations
        call: photoshop-document.applydocumentoperations
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoshop-document-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Photoshop API — Document. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-apply-document
      description: Adobe Creative Suite Apply Document Operations
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: photoshop-document.applydocumentoperations
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
