naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe PDF Services API — Assets
  description: 'Adobe Creative Suite Adobe PDF Services API — Assets. 3 operations. Lead operation: Adobe Creative Suite Upload
    Asset. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pdf-services-assets
    baseUri: https://pdf-services.adobe.io
    description: Adobe Creative Suite Adobe PDF Services API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: assets
      path: /assets
      operations:
      - name: uploadasset
        method: POST
        description: Adobe Creative Suite Upload Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: assets-assetID
      path: /assets/{assetID}
      operations:
      - name: getasset
        method: GET
        description: Adobe Creative Suite Get Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetID
          in: path
          type: string
          description: Unique identifier of the asset to retrieve
          required: true
      - name: deleteasset
        method: DELETE
        description: Adobe Creative Suite Delete Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetID
          in: path
          type: string
          description: Unique identifier of the asset to delete
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: pdf-services-assets-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe PDF Services API — Assets. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/assets
      name: assets
      description: REST surface for assets.
      operations:
      - method: POST
        name: uploadasset
        description: Adobe Creative Suite Upload Asset
        call: pdf-services-assets.uploadasset
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets/{assetid}
      name: assets-assetid
      description: REST surface for assets-assetID.
      operations:
      - method: GET
        name: getasset
        description: Adobe Creative Suite Get Asset
        call: pdf-services-assets.getasset
        with:
          assetID: rest.assetID
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteasset
        description: Adobe Creative Suite Delete Asset
        call: pdf-services-assets.deleteasset
        with:
          assetID: rest.assetID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pdf-services-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe PDF Services API — Assets. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-upload-asset
      description: Adobe Creative Suite Upload Asset
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pdf-services-assets.uploadasset
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-creative-suite-get-asset
      description: Adobe Creative Suite Get Asset
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pdf-services-assets.getasset
      with:
        assetID: tools.assetID
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-creative-suite-delete-asset
      description: Adobe Creative Suite Delete Asset
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: pdf-services-assets.deleteasset
      with:
        assetID: tools.assetID
      outputParameters:
      - type: object
        mapping: $.
