naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Photoshop API — Text
  description: 'Adobe Creative Suite Adobe Photoshop API — Text. 1 operations. Lead operation: Adobe Creative Suite Edit Text
    Layers. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Text
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoshop-text
    baseUri: https://image.adobe.io
    description: Adobe Creative Suite Adobe Photoshop API — Text business capability. Self-contained, no shared references.
    resources:
    - name: pie-psdService-text
      path: /pie/psdService/text
      operations:
      - name: edittextlayers
        method: POST
        description: Adobe Creative Suite Edit Text Layers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: photoshop-text-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Photoshop API — Text. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/pie/psdservice/text
      name: pie-psdservice-text
      description: REST surface for pie-psdService-text.
      operations:
      - method: POST
        name: edittextlayers
        description: Adobe Creative Suite Edit Text Layers
        call: photoshop-text.edittextlayers
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoshop-text-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Photoshop API — Text. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-edit-text
      description: Adobe Creative Suite Edit Text Layers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: photoshop-text.edittextlayers
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
