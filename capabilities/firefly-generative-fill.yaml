naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Firefly API — Generative Fill
  description: 'Adobe Creative Suite Adobe Firefly API — Generative Fill. 1 operations. Lead operation: Adobe Creative Suite
    Generative Fill. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Generative Fill
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: firefly-generative-fill
    baseUri: https://firefly-api.adobe.io/v3
    description: Adobe Creative Suite Adobe Firefly API — Generative Fill business capability. Self-contained, no shared references.
    resources:
    - name: images-fill-async
      path: /images/fill-async
      operations:
      - name: fillimageasync
        method: POST
        description: Adobe Creative Suite Generative Fill
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: firefly-generative-fill-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Firefly API — Generative Fill. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/images/fill-async
      name: images-fill-async
      description: REST surface for images-fill-async.
      operations:
      - method: POST
        name: fillimageasync
        description: Adobe Creative Suite Generative Fill
        call: firefly-generative-fill.fillimageasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: firefly-generative-fill-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Firefly API — Generative Fill. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-generative-fill
      description: Adobe Creative Suite Generative Fill
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firefly-generative-fill.fillimageasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
