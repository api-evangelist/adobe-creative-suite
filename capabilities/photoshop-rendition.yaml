naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Photoshop API — Rendition
  description: 'Adobe Creative Suite Adobe Photoshop API — Rendition. 1 operations. Lead operation: Adobe Creative Suite Create
    Rendition. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Rendition
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoshop-rendition
    baseUri: https://image.adobe.io
    description: Adobe Creative Suite Adobe Photoshop API — Rendition business capability. Self-contained, no shared references.
    resources:
    - name: pie-psdService-renditionCreate
      path: /pie/psdService/renditionCreate
      operations:
      - name: createrendition
        method: POST
        description: Adobe Creative Suite Create Rendition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: photoshop-rendition-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Photoshop API — Rendition. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/pie/psdservice/renditioncreate
      name: pie-psdservice-renditioncreate
      description: REST surface for pie-psdService-renditionCreate.
      operations:
      - method: POST
        name: createrendition
        description: Adobe Creative Suite Create Rendition
        call: photoshop-rendition.createrendition
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoshop-rendition-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Photoshop API — Rendition. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-create-rendition
      description: Adobe Creative Suite Create Rendition
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: photoshop-rendition.createrendition
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
