naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Photoshop API — Layers
  description: 'Adobe Creative Suite Adobe Photoshop API — Layers. 1 operations. Lead operation: Adobe Creative Suite Manage
    Layers. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Layers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoshop-layers
    baseUri: https://image.adobe.io
    description: Adobe Creative Suite Adobe Photoshop API — Layers business capability. Self-contained, no shared references.
    resources:
    - name: pie-psdService-layers
      path: /pie/psdService/layers
      operations:
      - name: managelayers
        method: POST
        description: Adobe Creative Suite Manage Layers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: photoshop-layers-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Photoshop API — Layers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/pie/psdservice/layers
      name: pie-psdservice-layers
      description: REST surface for pie-psdService-layers.
      operations:
      - method: POST
        name: managelayers
        description: Adobe Creative Suite Manage Layers
        call: photoshop-layers.managelayers
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoshop-layers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Photoshop API — Layers. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-manage-layers
      description: Adobe Creative Suite Manage Layers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: photoshop-layers.managelayers
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
