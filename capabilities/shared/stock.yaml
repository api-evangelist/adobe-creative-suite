naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Stock API"
  description: "Search, licensing, and retrieval of stock photos, illustrations, vectors, videos, and templates from the Adobe Stock marketplace. Supports both editorial and commercial licensing workflows."
  tags:
    - Adobe
    - Stock
    - Digital Assets
    - Licensing
    - Search
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_STOCK_TOKEN: ADOBE_STOCK_TOKEN
      ADOBE_STOCK_API_KEY: ADOBE_STOCK_API_KEY

capability:
  consumes:
    - type: http
      namespace: stock
      baseUri: https://stock.adobe.io/Rest
      description: "Adobe Stock API for searching and licensing stock content"
      authentication:
        type: bearer
        token: "{{ADOBE_STOCK_TOKEN}}"
      resources:
        - name: search
          path: /Media/1/Search
          description: "Search and discover stock content"
          operations:
            - name: search-stock-files
              method: GET
              path: /Files
              description: "Searches the Adobe Stock library for files matching specified criteria"
              inputParameters:
                - name: locale
                  in: query
                  type: string
                  required: false
                  description: "BCP 47 locale code for localized search results"
                - name: search_parameters[words]
                  in: query
                  type: string
                  required: false
                  description: "Keywords to search for in the stock library"
                - name: search_parameters[limit]
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results to return per page (1-64)"
                - name: search_parameters[offset]
                  in: query
                  type: integer
                  required: false
                  description: "Number of results to skip for pagination"
                - name: search_parameters[filters][content_type:photo]
                  in: query
                  type: integer
                  required: false
                  description: "Include photos in results (1 = include, 0 = exclude)"
                - name: search_parameters[filters][content_type:illustration]
                  in: query
                  type: integer
                  required: false
                  description: "Include illustrations in results (1 = include, 0 = exclude)"
                - name: search_parameters[filters][content_type:vector]
                  in: query
                  type: integer
                  required: false
                  description: "Include vector files in results (1 = include, 0 = exclude)"
                - name: search_parameters[filters][content_type:video]
                  in: query
                  type: integer
                  required: false
                  description: "Include video files in results (1 = include, 0 = exclude)"
                - name: search_parameters[filters][orientation]
                  in: query
                  type: string
                  required: false
                  description: "Filter by image orientation"
                - name: search_parameters[filters][premium]
                  in: query
                  type: string
                  required: false
                  description: "Filter by premium status"
                - name: result_columns[]
                  in: query
                  type: array
                  required: false
                  description: "Fields to include in the response"
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-stock-file-metadata
              method: GET
              path: /Files/{content_id}
              description: "Retrieves detailed metadata for a specific stock file by its content ID"
              inputParameters:
                - name: content_id
                  in: path
                  type: integer
                  required: true
                  description: "Adobe Stock unique content identifier"
                - name: locale
                  in: query
                  type: string
                  required: false
                  description: "BCP 47 locale for localized response data"
                - name: result_columns[]
                  in: query
                  type: array
                  required: false
                  description: "Fields to include in the response"
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-category-tree
              method: GET
              path: /CategoryTree
              description: "Retrieves the hierarchical category tree used to organize Adobe Stock content"
              inputParameters:
                - name: locale
                  in: query
                  type: string
                  required: false
                  description: "BCP 47 locale for localized category names"
                - name: category_id
                  in: query
                  type: integer
                  required: false
                  description: "Root category ID to retrieve subtree from"
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: member
          path: /Member/1
          description: "Member profile and licensing operations"
          operations:
            - name: get-member-profile
              method: GET
              path: /Profile
              description: "Retrieves the profile of the authenticated Adobe Stock member including quota information"
              inputParameters:
                - name: locale
                  in: query
                  type: string
                  required: false
                  description: "BCP 47 locale for localized profile data"
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: license
          path: /Member/1
          description: "License stock assets for use in projects"
          operations:
            - name: get-license-history
              method: GET
              path: /License
              description: "Retrieves the license history for the authenticated member"
              inputParameters:
                - name: locale
                  in: query
                  type: string
                  required: false
                  description: "BCP 47 locale for localized response data"
                - name: search_parameters[limit]
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results to return"
                - name: search_parameters[offset]
                  in: query
                  type: integer
                  required: false
                  description: "Number of results to skip for pagination"
                - name: result_columns[]
                  in: query
                  type: array
                  required: false
                  description: "Fields to include in the license history response"
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: license-image
              method: POST
              path: /LicenseImage
              description: "Licenses a stock photo for use in a project"
              inputParameters:
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              body:
                type: json
                data:
                  content_id: "{{tools.content_id}}"
                  license: "{{tools.license}}"
                  locale: "{{tools.locale}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: license-vector
              method: POST
              path: /LicenseVectorOrIllustration
              description: "Licenses a vector or illustration stock file for use in a project"
              inputParameters:
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              body:
                type: json
                data:
                  content_id: "{{tools.content_id}}"
                  license: "{{tools.license}}"
                  locale: "{{tools.locale}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: license-video
              method: POST
              path: /LicenseVideo
              description: "Licenses a stock video clip for use in a project"
              inputParameters:
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              body:
                type: json
                data:
                  content_id: "{{tools.content_id}}"
                  license: "{{tools.license}}"
                  locale: "{{tools.locale}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-license-stats
              method: POST
              path: /LicenseStats
              description: "Retrieves licensing statistics for the authenticated member"
              inputParameters:
                - name: x-api-key
                  in: header
                  type: string
                  required: true
                  description: "Adobe Stock API key (client ID)"
              body:
                type: json
                data:
                  locale: "{{tools.locale}}"
                  result_columns: "{{tools.result_columns}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8103
      namespace: stock-api
      resources:
        - path: /v1/stock-files
          name: stock-files
          description: "Stock file search operations"
          operations:
            - method: GET
              name: search-stock-files
              description: "Search the Adobe Stock library"
              call: "stock.search-stock-files"

        - path: /v1/stock-files/{content_id}
          name: stock-file-detail
          description: "Stock file metadata"
          operations:
            - method: GET
              name: get-stock-file-metadata
              description: "Get metadata for a specific stock file"
              call: "stock.get-stock-file-metadata"

        - path: /v1/categories
          name: categories
          description: "Stock content categories"
          operations:
            - method: GET
              name: get-category-tree
              description: "Get the stock content category tree"
              call: "stock.get-category-tree"

        - path: /v1/members/profile
          name: member-profile
          description: "Member profile operations"
          operations:
            - method: GET
              name: get-member-profile
              description: "Get the authenticated member profile"
              call: "stock.get-member-profile"

        - path: /v1/licenses
          name: licenses
          description: "License history"
          operations:
            - method: GET
              name: get-license-history
              description: "Get license history for the member"
              call: "stock.get-license-history"

        - path: /v1/licenses/images
          name: license-images
          description: "Image licensing"
          operations:
            - method: POST
              name: license-image
              description: "License a stock photo"
              call: "stock.license-image"

        - path: /v1/licenses/vectors
          name: license-vectors
          description: "Vector licensing"
          operations:
            - method: POST
              name: license-vector
              description: "License a vector or illustration"
              call: "stock.license-vector"

        - path: /v1/licenses/videos
          name: license-videos
          description: "Video licensing"
          operations:
            - method: POST
              name: license-video
              description: "License a stock video"
              call: "stock.license-video"

        - path: /v1/licenses/stats
          name: license-stats
          description: "Licensing statistics"
          operations:
            - method: POST
              name: get-license-stats
              description: "Get licensing statistics"
              call: "stock.get-license-stats"

    - type: mcp
      port: 9103
      namespace: stock-mcp
      transport: http
      tools:
        - name: search-stock-files
          description: "Search the Adobe Stock library for photos, illustrations, vectors, and videos"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "stock.search-stock-files"

        - name: get-stock-file-metadata
          description: "Get detailed metadata for a specific stock file"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "stock.get-stock-file-metadata"

        - name: get-category-tree
          description: "Get the hierarchical category tree for Adobe Stock content"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "stock.get-category-tree"

        - name: get-member-profile
          description: "Get the authenticated Adobe Stock member profile and quota"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "stock.get-member-profile"

        - name: get-license-history
          description: "Get the license history for the authenticated member"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "stock.get-license-history"

        - name: license-image
          description: "License a stock photo for use in a project"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "stock.license-image"

        - name: license-vector
          description: "License a vector or illustration for use in a project"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "stock.license-vector"

        - name: license-video
          description: "License a stock video clip for use in a project"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "stock.license-video"

        - name: get-license-stats
          description: "Get licensing statistics for the authenticated member"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "stock.get-license-stats"
