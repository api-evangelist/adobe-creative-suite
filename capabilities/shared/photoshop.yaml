naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Photoshop API"
  description: "Programmatic access to Photoshop image manipulation capabilities including automated editing, masking, compositing, layer management, rendition creation, and document operations without requiring a desktop installation."
  tags:
    - Adobe
    - Photoshop
    - Image Editing
    - Layer Management
    - Renditions
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_PHOTOSHOP_TOKEN: ADOBE_PHOTOSHOP_TOKEN

capability:
  consumes:
    - type: http
      namespace: photoshop
      baseUri: https://image.adobe.io
      description: "Adobe Photoshop API for programmatic image manipulation"
      authentication:
        type: bearer
        token: "{{ADOBE_PHOTOSHOP_TOKEN}}"
      resources:
        - name: cutout
          path: /sensei
          description: "Background removal and masking operations"
          operations:
            - name: remove-background
              method: POST
              path: /cutout
              description: "Removes the background from an image using Adobe Sensei AI"
              body:
                type: json
                data:
                  input: "{{tools.input}}"
                  output: "{{tools.output}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: product-crop
              method: POST
              path: /product_crop
              description: "Automatically crops an image to focus on the primary product subject"
              body:
                type: json
                data:
                  input: "{{tools.input}}"
                  output: "{{tools.output}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: straighten-image
              method: POST
              path: /straighten
              description: "Automatically detects and corrects the rotation of an image"
              body:
                type: json
                data:
                  input: "{{tools.input}}"
                  output: "{{tools.output}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: mask
          path: /sensei
          description: "Alpha mask creation operations"
          operations:
            - name: create-mask
              method: POST
              path: /mask
              description: "Creates an alpha mask for an image using Adobe Sensei AI"
              body:
                type: json
                data:
                  input: "{{tools.input}}"
                  output: "{{tools.output}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: text
          path: /pie/psdService
          description: "Text layer editing operations"
          operations:
            - name: edit-text-layers
              method: POST
              path: /text
              description: "Edits text content, font properties, and styling of text layers within a PSD document"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
                  outputs: "{{tools.outputs}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: layers
          path: /pie/psdService
          description: "PSD layer management operations"
          operations:
            - name: manage-layers
              method: POST
              path: /layers
              description: "Reads, adds, modifies, or deletes layers within a PSD document"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
                  outputs: "{{tools.outputs}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: document
          path: /pie/psdService
          description: "Document-level operations"
          operations:
            - name: apply-document-operations
              method: POST
              path: /documentOperations
              description: "Applies operations to a PSD document such as resizing, flattening, and color mode conversions"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
                  outputs: "{{tools.outputs}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: rendition
          path: /pie/psdService
          description: "Rendition and export operations"
          operations:
            - name: create-rendition
              method: POST
              path: /renditionCreate
              description: "Generates one or more renditions from a PSD or image in JPEG, PNG, or TIFF"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
                  outputs: "{{tools.outputs}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: smart-object
          path: /pie/psdService
          description: "Smart object editing operations"
          operations:
            - name: edit-smart-object
              method: POST
              path: /smartObject
              description: "Replaces the content of a smart object layer within a PSD document"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
                  outputs: "{{tools.outputs}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: artboard
          path: /pie/psdService
          description: "Artboard creation and management"
          operations:
            - name: create-artboard
              method: POST
              path: /artboard
              description: "Creates one or more artboards within a PSD document"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
                  outputs: "{{tools.outputs}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: status
          path: /pie/psdService/status
          description: "Asynchronous job status operations"
          operations:
            - name: get-job-status
              method: GET
              path: /{jobId}
              description: "Retrieves the current status of an asynchronous Photoshop API job"
              inputParameters:
                - name: jobId
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the job to check"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: photoshop-api
      resources:
        - path: /v1/cutouts
          name: cutouts
          description: "Background removal operations"
          operations:
            - method: POST
              name: remove-background
              description: "Remove the background from an image"
              call: "photoshop.remove-background"

        - path: /v1/product-crops
          name: product-crops
          description: "Product cropping operations"
          operations:
            - method: POST
              name: product-crop
              description: "Auto-crop an image to the primary product"
              call: "photoshop.product-crop"

        - path: /v1/straighten-jobs
          name: straighten-jobs
          description: "Image straightening operations"
          operations:
            - method: POST
              name: straighten-image
              description: "Straighten a rotated image"
              call: "photoshop.straighten-image"

        - path: /v1/masks
          name: masks
          description: "Alpha mask operations"
          operations:
            - method: POST
              name: create-mask
              description: "Create an alpha mask for an image"
              call: "photoshop.create-mask"

        - path: /v1/text-edits
          name: text-edits
          description: "Text layer editing operations"
          operations:
            - method: POST
              name: edit-text-layers
              description: "Edit text layers in a PSD"
              call: "photoshop.edit-text-layers"

        - path: /v1/layers
          name: layers
          description: "Layer management operations"
          operations:
            - method: POST
              name: manage-layers
              description: "Manage layers in a PSD document"
              call: "photoshop.manage-layers"

        - path: /v1/document-operations
          name: document-operations
          description: "Document-level operations"
          operations:
            - method: POST
              name: apply-document-operations
              description: "Apply operations to a PSD document"
              call: "photoshop.apply-document-operations"

        - path: /v1/renditions
          name: renditions
          description: "Rendition creation operations"
          operations:
            - method: POST
              name: create-rendition
              description: "Create renditions from a PSD or image"
              call: "photoshop.create-rendition"

        - path: /v1/smart-objects
          name: smart-objects
          description: "Smart object editing operations"
          operations:
            - method: POST
              name: edit-smart-object
              description: "Replace smart object content in a PSD"
              call: "photoshop.edit-smart-object"

        - path: /v1/artboards
          name: artboards
          description: "Artboard operations"
          operations:
            - method: POST
              name: create-artboard
              description: "Create artboards in a PSD document"
              call: "photoshop.create-artboard"

        - path: /v1/jobs/{jobId}
          name: jobs
          description: "Job status polling"
          operations:
            - method: GET
              name: get-job-status
              description: "Get the status of an async Photoshop job"
              call: "photoshop.get-job-status"

    - type: mcp
      port: 9102
      namespace: photoshop-mcp
      transport: http
      tools:
        - name: remove-background
          description: "Remove the background from an image using Adobe Sensei AI"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.remove-background"

        - name: product-crop
          description: "Auto-crop an image to focus on the primary product"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.product-crop"

        - name: straighten-image
          description: "Automatically straighten a rotated image"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.straighten-image"

        - name: create-mask
          description: "Create an alpha mask for an image using Adobe Sensei AI"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.create-mask"

        - name: edit-text-layers
          description: "Edit text content and styling in PSD text layers"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.edit-text-layers"

        - name: manage-layers
          description: "Read, add, modify, or delete layers in a PSD document"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.manage-layers"

        - name: apply-document-operations
          description: "Apply resize, flatten, trim operations to a PSD document"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.apply-document-operations"

        - name: create-rendition
          description: "Create renditions from a PSD or image in JPEG, PNG, or TIFF"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.create-rendition"

        - name: edit-smart-object
          description: "Replace smart object content in a PSD document"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.edit-smart-object"

        - name: create-artboard
          description: "Create artboards within a PSD document"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "photoshop.create-artboard"

        - name: get-job-status
          description: "Get the status of an asynchronous Photoshop API job"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "photoshop.get-job-status"
