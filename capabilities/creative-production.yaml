naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Production
  description: End-to-end creative asset production workflow combining AI content generation (Firefly), image editing and
    manipulation (Photoshop), and stock asset sourcing and licensing (Stock). Used by creative directors, production designers,
    and marketing teams to find, generate, edit, and finalize visual assets.
  tags:
  - Adobe
  - Creative Production
  - Generative AI
  - Image Editing
  - Stock Assets
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ADOBE_FIREFLY_TOKEN: ADOBE_FIREFLY_TOKEN
    ADOBE_PHOTOSHOP_TOKEN: ADOBE_PHOTOSHOP_TOKEN
    ADOBE_STOCK_TOKEN: ADOBE_STOCK_TOKEN
    ADOBE_STOCK_API_KEY: ADOBE_STOCK_API_KEY
capability:
  consumes:
  - type: http
    namespace: firefly
    baseUri: https://firefly-api.adobe.io/v3
    description: Adobe Firefly API for generative AI image and video creation
    authentication:
      type: bearer
      token: '{{ADOBE_FIREFLY_TOKEN}}'
    resources:
    - name: image-generation
      path: /images
      description: Text-to-image and image variation generation operations
      operations:
      - name: generate-images-async
        method: POST
        path: /generate-async
        description: Generates one or more images from a text prompt using the Adobe Firefly generative AI model
        body:
          type: json
          data:
            prompt: '{{tools.prompt}}'
            negativePrompt: '{{tools.negative_prompt}}'
            contentClass: '{{tools.content_class}}'
            numVariations: '{{tools.num_variations}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: generate-similar-images-async
        method: POST
        path: /generate-similar-async
        description: Generates images visually similar to a provided reference image
        body:
          type: json
          data:
            prompt: '{{tools.prompt}}'
            image: '{{tools.image}}'
            numVariations: '{{tools.num_variations}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: generative-expand
      path: /images
      description: Expand images beyond their original boundaries
      operations:
      - name: expand-image-async
        method: POST
        path: /expand-async
        description: Expands an existing image beyond its original boundaries using generative AI
        body:
          type: json
          data:
            prompt: '{{tools.prompt}}'
            negativePrompt: '{{tools.negative_prompt}}'
            image: '{{tools.image}}'
            numVariations: '{{tools.num_variations}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: generative-fill
      path: /images
      description: Fill selected regions of images with AI-generated content
      operations:
      - name: fill-image-async
        method: POST
        path: /fill-async
        description: Fills a masked region of an existing image with AI-generated content based on a text prompt
        body:
          type: json
          data:
            prompt: '{{tools.prompt}}'
            negativePrompt: '{{tools.negative_prompt}}'
            image: '{{tools.image}}'
            mask: '{{tools.mask}}'
            numVariations: '{{tools.num_variations}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: object-composite
      path: /images
      description: Composite AI-generated objects into existing images
      operations:
      - name: generate-object-composite-async
        method: POST
        path: /generate-object-composite-async
        description: Generates an AI-rendered object and composites it into an existing scene image
        body:
          type: json
          data:
            prompt: '{{tools.prompt}}'
            negativePrompt: '{{tools.negative_prompt}}'
            contentClass: '{{tools.content_class}}'
            image: '{{tools.image}}'
            mask: '{{tools.mask}}'
            numVariations: '{{tools.num_variations}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: video-generation
      path: /videos
      description: Generate video from text prompts
      operations:
      - name: generate-video-async
        method: POST
        path: /generate-async
        description: Generates a short video clip from a text prompt using the Adobe Firefly video generation model
        body:
          type: json
          data:
            prompt: '{{tools.prompt}}'
            negativePrompt: '{{tools.negative_prompt}}'
            duration: '{{tools.duration}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: status
      path: /status
      description: Asynchronous job status polling
      operations:
      - name: get-generation-status
        method: GET
        path: /{jobId}
        description: Retrieves the current status of an asynchronous Firefly generation job
        inputParameters:
        - name: jobId
          in: path
          type: string
          required: true
          description: Unique identifier of the generation job to check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: photoshop
    baseUri: https://image.adobe.io
    description: Adobe Photoshop API for programmatic image manipulation
    authentication:
      type: bearer
      token: '{{ADOBE_PHOTOSHOP_TOKEN}}'
    resources:
    - name: cutout
      path: /sensei
      description: Background removal and masking operations
      operations:
      - name: remove-background
        method: POST
        path: /cutout
        description: Removes the background from an image using Adobe Sensei AI
        body:
          type: json
          data:
            input: '{{tools.input}}'
            output: '{{tools.output}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: product-crop
        method: POST
        path: /product_crop
        description: Automatically crops an image to focus on the primary product subject
        body:
          type: json
          data:
            input: '{{tools.input}}'
            output: '{{tools.output}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: straighten-image
        method: POST
        path: /straighten
        description: Automatically detects and corrects the rotation of an image
        body:
          type: json
          data:
            input: '{{tools.input}}'
            output: '{{tools.output}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mask
      path: /sensei
      description: Alpha mask creation operations
      operations:
      - name: create-mask
        method: POST
        path: /mask
        description: Creates an alpha mask for an image using Adobe Sensei AI
        body:
          type: json
          data:
            input: '{{tools.input}}'
            output: '{{tools.output}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: text
      path: /pie/psdService
      description: Text layer editing operations
      operations:
      - name: edit-text-layers
        method: POST
        path: /text
        description: Edits text content, font properties, and styling of text layers within a PSD document
        body:
          type: json
          data:
            inputs: '{{tools.inputs}}'
            outputs: '{{tools.outputs}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: layers
      path: /pie/psdService
      description: PSD layer management operations
      operations:
      - name: manage-layers
        method: POST
        path: /layers
        description: Reads, adds, modifies, or deletes layers within a PSD document
        body:
          type: json
          data:
            inputs: '{{tools.inputs}}'
            outputs: '{{tools.outputs}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: document
      path: /pie/psdService
      description: Document-level operations
      operations:
      - name: apply-document-operations
        method: POST
        path: /documentOperations
        description: Applies operations to a PSD document such as resizing, flattening, and color mode conversions
        body:
          type: json
          data:
            inputs: '{{tools.inputs}}'
            outputs: '{{tools.outputs}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rendition
      path: /pie/psdService
      description: Rendition and export operations
      operations:
      - name: create-rendition
        method: POST
        path: /renditionCreate
        description: Generates one or more renditions from a PSD or image in JPEG, PNG, or TIFF
        body:
          type: json
          data:
            inputs: '{{tools.inputs}}'
            outputs: '{{tools.outputs}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: smart-object
      path: /pie/psdService
      description: Smart object editing operations
      operations:
      - name: edit-smart-object
        method: POST
        path: /smartObject
        description: Replaces the content of a smart object layer within a PSD document
        body:
          type: json
          data:
            inputs: '{{tools.inputs}}'
            outputs: '{{tools.outputs}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: artboard
      path: /pie/psdService
      description: Artboard creation and management
      operations:
      - name: create-artboard
        method: POST
        path: /artboard
        description: Creates one or more artboards within a PSD document
        body:
          type: json
          data:
            inputs: '{{tools.inputs}}'
            outputs: '{{tools.outputs}}'
            options: '{{tools.options}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: status
      path: /pie/psdService/status
      description: Asynchronous job status operations
      operations:
      - name: get-job-status
        method: GET
        path: /{jobId}
        description: Retrieves the current status of an asynchronous Photoshop API job
        inputParameters:
        - name: jobId
          in: path
          type: string
          required: true
          description: The unique identifier of the job to check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: stock
    baseUri: https://stock.adobe.io/Rest
    description: Adobe Stock API for searching and licensing stock content
    authentication:
      type: bearer
      token: '{{ADOBE_STOCK_TOKEN}}'
    resources:
    - name: search
      path: /Media/1/Search
      description: Search and discover stock content
      operations:
      - name: search-stock-files
        method: GET
        path: /Files
        description: Searches the Adobe Stock library for files matching specified criteria
        inputParameters:
        - name: locale
          in: query
          type: string
          required: false
          description: BCP 47 locale code for localized search results
        - name: search_parameters[words]
          in: query
          type: string
          required: false
          description: Keywords to search for in the stock library
        - name: search_parameters[limit]
          in: query
          type: integer
          required: false
          description: Maximum number of results to return per page (1-64)
        - name: search_parameters[offset]
          in: query
          type: integer
          required: false
          description: Number of results to skip for pagination
        - name: search_parameters[filters][content_type:photo]
          in: query
          type: integer
          required: false
          description: Include photos in results (1 = include, 0 = exclude)
        - name: search_parameters[filters][content_type:illustration]
          in: query
          type: integer
          required: false
          description: Include illustrations in results (1 = include, 0 = exclude)
        - name: search_parameters[filters][content_type:vector]
          in: query
          type: integer
          required: false
          description: Include vector files in results (1 = include, 0 = exclude)
        - name: search_parameters[filters][content_type:video]
          in: query
          type: integer
          required: false
          description: Include video files in results (1 = include, 0 = exclude)
        - name: search_parameters[filters][orientation]
          in: query
          type: string
          required: false
          description: Filter by image orientation
        - name: search_parameters[filters][premium]
          in: query
          type: string
          required: false
          description: Filter by premium status
        - name: result_columns[]
          in: query
          type: array
          required: false
          description: Fields to include in the response
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-stock-file-metadata
        method: GET
        path: /Files/{content_id}
        description: Retrieves detailed metadata for a specific stock file by its content ID
        inputParameters:
        - name: content_id
          in: path
          type: integer
          required: true
          description: Adobe Stock unique content identifier
        - name: locale
          in: query
          type: string
          required: false
          description: BCP 47 locale for localized response data
        - name: result_columns[]
          in: query
          type: array
          required: false
          description: Fields to include in the response
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-category-tree
        method: GET
        path: /CategoryTree
        description: Retrieves the hierarchical category tree used to organize Adobe Stock content
        inputParameters:
        - name: locale
          in: query
          type: string
          required: false
          description: BCP 47 locale for localized category names
        - name: category_id
          in: query
          type: integer
          required: false
          description: Root category ID to retrieve subtree from
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: member
      path: /Member/1
      description: Member profile and licensing operations
      operations:
      - name: get-member-profile
        method: GET
        path: /Profile
        description: Retrieves the profile of the authenticated Adobe Stock member including quota information
        inputParameters:
        - name: locale
          in: query
          type: string
          required: false
          description: BCP 47 locale for localized profile data
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: license
      path: /Member/1
      description: License stock assets for use in projects
      operations:
      - name: get-license-history
        method: GET
        path: /License
        description: Retrieves the license history for the authenticated member
        inputParameters:
        - name: locale
          in: query
          type: string
          required: false
          description: BCP 47 locale for localized response data
        - name: search_parameters[limit]
          in: query
          type: integer
          required: false
          description: Maximum number of results to return
        - name: search_parameters[offset]
          in: query
          type: integer
          required: false
          description: Number of results to skip for pagination
        - name: result_columns[]
          in: query
          type: array
          required: false
          description: Fields to include in the license history response
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: license-image
        method: POST
        path: /LicenseImage
        description: Licenses a stock photo for use in a project
        inputParameters:
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        body:
          type: json
          data:
            content_id: '{{tools.content_id}}'
            license: '{{tools.license}}'
            locale: '{{tools.locale}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: license-vector
        method: POST
        path: /LicenseVectorOrIllustration
        description: Licenses a vector or illustration stock file for use in a project
        inputParameters:
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        body:
          type: json
          data:
            content_id: '{{tools.content_id}}'
            license: '{{tools.license}}'
            locale: '{{tools.locale}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: license-video
        method: POST
        path: /LicenseVideo
        description: Licenses a stock video clip for use in a project
        inputParameters:
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        body:
          type: json
          data:
            content_id: '{{tools.content_id}}'
            license: '{{tools.license}}'
            locale: '{{tools.locale}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-license-stats
        method: POST
        path: /LicenseStats
        description: Retrieves licensing statistics for the authenticated member
        inputParameters:
        - name: x-api-key
          in: header
          type: string
          required: true
          description: Adobe Stock API key (client ID)
        body:
          type: json
          data:
            locale: '{{tools.locale}}'
            result_columns: '{{tools.result_columns}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: creative-production-api
    description: Unified REST API for end-to-end creative asset production combining AI generation, image editing, and stock
      sourcing.
    resources:
    - path: /v1/generations
      name: generations
      description: AI image generation from text prompts
      operations:
      - method: POST
        name: generate-images
        description: Generate images from a text prompt using Firefly
        call: firefly.generate-images-async
        with:
          prompt: rest.prompt
          negative_prompt: rest.negative_prompt
          content_class: rest.content_class
          num_variations: rest.num_variations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/generations/similar
      name: similar-generations
      description: Generate similar image variations
      operations:
      - method: POST
        name: generate-similar-images
        description: Generate images similar to a reference image
        call: firefly.generate-similar-images-async
        with:
          prompt: rest.prompt
          image: rest.image
          num_variations: rest.num_variations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/expansions
      name: expansions
      description: AI-powered image expansion
      operations:
      - method: POST
        name: expand-image
        description: Expand an image beyond its boundaries using Firefly
        call: firefly.expand-image-async
        with:
          prompt: rest.prompt
          image: rest.image
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fills
      name: fills
      description: AI-powered generative fill
      operations:
      - method: POST
        name: fill-image
        description: Fill a masked region with AI-generated content
        call: firefly.fill-image-async
        with:
          prompt: rest.prompt
          image: rest.image
          mask: rest.mask
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/composites
      name: composites
      description: AI object compositing
      operations:
      - method: POST
        name: generate-composite
        description: Generate and composite an AI object into a scene
        call: firefly.generate-object-composite-async
        with:
          prompt: rest.prompt
          image: rest.image
          mask: rest.mask
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/videos
      name: videos
      description: AI video generation
      operations:
      - method: POST
        name: generate-video
        description: Generate a video from a text prompt using Firefly
        call: firefly.generate-video-async
        with:
          prompt: rest.prompt
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cutouts
      name: cutouts
      description: Background removal
      operations:
      - method: POST
        name: remove-background
        description: Remove background from an image using Photoshop
        call: photoshop.remove-background
        with:
          input: rest.input
          output: rest.output
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/masks
      name: masks
      description: Alpha mask creation
      operations:
      - method: POST
        name: create-mask
        description: Create an alpha mask for an image
        call: photoshop.create-mask
        with:
          input: rest.input
          output: rest.output
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/product-crops
      name: product-crops
      description: Product cropping
      operations:
      - method: POST
        name: product-crop
        description: Auto-crop an image to the primary product
        call: photoshop.product-crop
        with:
          input: rest.input
          output: rest.output
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/renditions
      name: renditions
      description: Image rendition creation
      operations:
      - method: POST
        name: create-rendition
        description: Create renditions from a PSD or image
        call: photoshop.create-rendition
        with:
          inputs: rest.inputs
          outputs: rest.outputs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/layers
      name: layers
      description: PSD layer management
      operations:
      - method: POST
        name: manage-layers
        description: Manage layers in a PSD document
        call: photoshop.manage-layers
        with:
          inputs: rest.inputs
          outputs: rest.outputs
          options: rest.options
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/text-edits
      name: text-edits
      description: PSD text layer editing
      operations:
      - method: POST
        name: edit-text-layers
        description: Edit text layers in a PSD document
        call: photoshop.edit-text-layers
        with:
          inputs: rest.inputs
          outputs: rest.outputs
          options: rest.options
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/smart-objects
      name: smart-objects
      description: Smart object replacement
      operations:
      - method: POST
        name: edit-smart-object
        description: Replace smart object content in a PSD
        call: photoshop.edit-smart-object
        with:
          inputs: rest.inputs
          outputs: rest.outputs
          options: rest.options
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/document-operations
      name: document-operations
      description: PSD document operations
      operations:
      - method: POST
        name: apply-document-operations
        description: Apply resize, flatten, or trim operations to a PSD
        call: photoshop.apply-document-operations
        with:
          inputs: rest.inputs
          outputs: rest.outputs
          options: rest.options
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/artboards
      name: artboards
      description: PSD artboard creation
      operations:
      - method: POST
        name: create-artboard
        description: Create artboards in a PSD document
        call: photoshop.create-artboard
        with:
          inputs: rest.inputs
          outputs: rest.outputs
          options: rest.options
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/straighten-jobs
      name: straighten-jobs
      description: Image straightening
      operations:
      - method: POST
        name: straighten-image
        description: Automatically straighten a rotated image
        call: photoshop.straighten-image
        with:
          input: rest.input
          output: rest.output
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stock-files
      name: stock-files
      description: Stock asset search
      operations:
      - method: GET
        name: search-stock-files
        description: Search the Adobe Stock library
        call: stock.search-stock-files
        with:
          search_parameters[words]: rest.keywords
          search_parameters[limit]: rest.limit
          search_parameters[offset]: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stock-files/{content_id}
      name: stock-file-detail
      description: Stock file metadata
      operations:
      - method: GET
        name: get-stock-file-metadata
        description: Get metadata for a specific stock file
        call: stock.get-stock-file-metadata
        with:
          content_id: rest.content_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/licenses/images
      name: license-images
      description: Stock image licensing
      operations:
      - method: POST
        name: license-image
        description: License a stock photo
        call: stock.license-image
        with:
          content_id: rest.content_id
          license: rest.license
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/licenses/vectors
      name: license-vectors
      description: Stock vector licensing
      operations:
      - method: POST
        name: license-vector
        description: License a vector or illustration
        call: stock.license-vector
