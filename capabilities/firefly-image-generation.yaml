naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Firefly API — Image Generation
  description: 'Adobe Creative Suite Adobe Firefly API — Image Generation. 2 operations. Lead operation: Adobe Creative Suite
    Generate Images from Text Prompt. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Image Generation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: firefly-image-generation
    baseUri: https://firefly-api.adobe.io/v3
    description: Adobe Creative Suite Adobe Firefly API — Image Generation business capability. Self-contained, no shared
      references.
    resources:
    - name: images-generate-async
      path: /images/generate-async
      operations:
      - name: generateimagesasync
        method: POST
        description: Adobe Creative Suite Generate Images from Text Prompt
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: images-generate-similar-async
      path: /images/generate-similar-async
      operations:
      - name: generatesimilarimagesasync
        method: POST
        description: Adobe Creative Suite Generate Similar Images
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: firefly-image-generation-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Firefly API — Image Generation. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/images/generate-async
      name: images-generate-async
      description: REST surface for images-generate-async.
      operations:
      - method: POST
        name: generateimagesasync
        description: Adobe Creative Suite Generate Images from Text Prompt
        call: firefly-image-generation.generateimagesasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/images/generate-similar-async
      name: images-generate-similar-async
      description: REST surface for images-generate-similar-async.
      operations:
      - method: POST
        name: generatesimilarimagesasync
        description: Adobe Creative Suite Generate Similar Images
        call: firefly-image-generation.generatesimilarimagesasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: firefly-image-generation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Firefly API — Image Generation. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-generate-images
      description: Adobe Creative Suite Generate Images from Text Prompt
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firefly-image-generation.generateimagesasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-creative-suite-generate-similar
      description: Adobe Creative Suite Generate Similar Images
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firefly-image-generation.generatesimilarimagesasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
