naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe PDF Services API — Operations
  description: 'Adobe Creative Suite Adobe PDF Services API — Operations. 1 operations. Lead operation: Adobe Creative Suite
    Get Operation Status. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Operations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pdf-services-operations
    baseUri: https://pdf-services.adobe.io
    description: Adobe Creative Suite Adobe PDF Services API — Operations business capability. Self-contained, no shared references.
    resources:
    - name: operation-jobId
      path: /operation/{jobId}
      operations:
      - name: getoperationstatus
        method: GET
        description: Adobe Creative Suite Get Operation Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobId
          in: path
          type: string
          description: Unique identifier of the operation job to check
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: pdf-services-operations-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe PDF Services API — Operations. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/operation/{jobid}
      name: operation-jobid
      description: REST surface for operation-jobId.
      operations:
      - method: GET
        name: getoperationstatus
        description: Adobe Creative Suite Get Operation Status
        call: pdf-services-operations.getoperationstatus
        with:
          jobId: rest.jobId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pdf-services-operations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe PDF Services API — Operations. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-get-operation
      description: Adobe Creative Suite Get Operation Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pdf-services-operations.getoperationstatus
      with:
        jobId: tools.jobId
      outputParameters:
      - type: object
        mapping: $.
