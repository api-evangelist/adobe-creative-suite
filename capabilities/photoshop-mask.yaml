naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Photoshop API — Mask
  description: 'Adobe Creative Suite Adobe Photoshop API — Mask. 1 operations. Lead operation: Adobe Creative Suite Create
    Alpha Mask. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Mask
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoshop-mask
    baseUri: https://image.adobe.io
    description: Adobe Creative Suite Adobe Photoshop API — Mask business capability. Self-contained, no shared references.
    resources:
    - name: sensei-mask
      path: /sensei/mask
      operations:
      - name: createmask
        method: POST
        description: Adobe Creative Suite Create Alpha Mask
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: photoshop-mask-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Photoshop API — Mask. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/sensei/mask
      name: sensei-mask
      description: REST surface for sensei-mask.
      operations:
      - method: POST
        name: createmask
        description: Adobe Creative Suite Create Alpha Mask
        call: photoshop-mask.createmask
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoshop-mask-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Photoshop API — Mask. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-create-alpha
      description: Adobe Creative Suite Create Alpha Mask
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: photoshop-mask.createmask
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
