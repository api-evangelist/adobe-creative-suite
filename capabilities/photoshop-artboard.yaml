naftiko: 1.0.0-alpha2
info:
  label: Adobe Creative Suite Adobe Photoshop API — Artboard
  description: 'Adobe Creative Suite Adobe Photoshop API — Artboard. 1 operations. Lead operation: Adobe Creative Suite Create
    Artboards. Self-contained Naftiko capability covering one Adobe Creative Suite business surface.'
  tags:
  - Adobe Creative Suite
  - Artboard
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CREATIVE_SUITE_API_KEY: ADOBE_CREATIVE_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: photoshop-artboard
    baseUri: https://image.adobe.io
    description: Adobe Creative Suite Adobe Photoshop API — Artboard business capability. Self-contained, no shared references.
    resources:
    - name: pie-psdService-artboard
      path: /pie/psdService/artboard
      operations:
      - name: createartboard
        method: POST
        description: Adobe Creative Suite Create Artboards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CREATIVE_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: photoshop-artboard-rest
    port: 8080
    description: REST adapter for Adobe Creative Suite Adobe Photoshop API — Artboard. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/pie/psdservice/artboard
      name: pie-psdservice-artboard
      description: REST surface for pie-psdService-artboard.
      operations:
      - method: POST
        name: createartboard
        description: Adobe Creative Suite Create Artboards
        call: photoshop-artboard.createartboard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: photoshop-artboard-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Creative Suite Adobe Photoshop API — Artboard. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-creative-suite-create-artboards
      description: Adobe Creative Suite Create Artboards
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: photoshop-artboard.createartboard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
