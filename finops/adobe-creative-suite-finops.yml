meters:
  - name: legacy_license
    description: Historical CS6 perpetual license (no longer sold)
    unit: license
    aggregation: sum
principles:
  - name: Visibility
    description: >-
      Inventory remaining CS6 installs in asset-management tooling;
      reclassify any active spend as legacy / unsupported.
  - name: Allocation
    description: >-
      Existing CS6 installs should be tracked per device / user for
      sunset-planning purposes only.
  - name: Optimization
    description: >-
      Migrate users to Creative Cloud subscriptions; the security and
      compatibility risk of running unsupported CS6 is no longer cost-justified.
  - name: Accountability
    description: >-
      IT / security team owns the migration roadmap from CS6 to Creative Cloud.
