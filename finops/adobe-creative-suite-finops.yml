serviceCategory: Creative SaaS (Discontinued)
billingModel:
  pricingCategory: Discontinued (Perpetual License)
  billingFrequency: One-Time
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Adobe Creative Suite
  ServiceCategory: Creative SaaS (Discontinued)
  ProviderName: Adobe
