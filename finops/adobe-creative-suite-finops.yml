specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Adobe Creative Suite
providerId: adobe-creative-suite
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Creative Suite
  - Legacy
notes: >-
  Creative Suite is a discontinued perpetual-license product. No active
  billing surface; no FinOps levers. This artifact is retained for catalog
  completeness only and points consumers to the adobe-creative-cloud repo
  for the active replacement.
description: >-
  Creative Suite is no longer commercially available. There is no active
  billing model. Customers should reference the adobe-creative-cloud
  FinOps artifact for the current Adobe creative-tools cost surface.
sources:
  - https://helpx.adobe.com/creative-suite/kb/creative-suite-end-support.html
