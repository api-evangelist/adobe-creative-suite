  - name: Adobe PDF Services API
    description: >-
      The Adobe PDF Services API provides cloud-based tools for creating, converting, combining, compressing, and
      extracting content from PDF documents. It is part of the Adobe Acrobat Services platform and supports operations
      such as HTML-to-PDF, PDF-to-Word, OCR, and PDF accessibility auto-tagging. The API offers SDKs for Java, Node.js,
      .NET, and Python.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://developer.adobe.com/document-services/
