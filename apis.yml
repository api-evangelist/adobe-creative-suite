- name: Adobe Illustrator API
  description: >-
    The Adobe Illustrator API enables programmatic creation and manipulation of vector graphics through
    scripting and plugin interfaces. It exposes the Illustrator object model so developers can automate
    repetitive design tasks, generate artwork, and integrate Illustrator into production pipelines. The
    API is available via UXP plugins and CEP extensions as well as scripting environments.
  image: https://www.adobe.com/content/dam/cc/icons/illustrator.svg
  humanURL: https://developer.adobe.com/illustrator/
  baseURL: https://image.adobe.io
  tags:
  - Automation
