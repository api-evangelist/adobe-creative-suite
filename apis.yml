  - name: Adobe Express Embed SDK
    description: >-
      The Adobe Express Embed SDK allows developers to embed Adobe Express editing capabilities directly into their own
      web applications. It provides a customizable in-app editing experience for images, videos, and templates powered
      by the Adobe Express platform. The SDK supports use cases such as branded template creation, social media asset
      editing, and document design within third-party products.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://developer.adobe.com/express/embed-sdk/
    baseURL: https://express-api.adobe.io
