  - name: Adobe Experience Manager Assets API
    description: >-
      The Adobe Experience Manager Assets API provides access to the AEM digital asset management system for uploading,
      retrieving, and managing assets stored in AEM as a Cloud Service. It enables integration with external systems for
      asset ingestion, metadata management, and rendition retrieval. The API follows RESTful conventions and uses Adobe
      IMS for authentication.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://developer.adobe.com/experience-manager/
    baseURL: https://author-{program}-{environment}.adobeaemcloud.com/api
    tags:
      - AEM
      - Content Management
      - Digital Asset Management
      - Experience Manager
    properties:
