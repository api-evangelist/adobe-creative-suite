  - name: Adobe Firefly API
    description: >-
      The Adobe Firefly API provides access to Adobe's generative AI capabilities for creating and editing images,
      vectors, and text effects from natural language prompts. It is built on the Firefly family of creative generative
      models trained on licensed and public domain content. The API supports text-to-image generation, generative fill,
      generative expand, and style transfer operations.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://developer.adobe.com/firefly-api/
    baseURL: https://firefly-api.adobe.io/v3
