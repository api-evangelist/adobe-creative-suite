  - name: Adobe Stock API
    description: >-
      The Adobe Stock API enables search, licensing, and retrieval of stock photos, illustrations, vectors, videos, and
      templates from the Adobe Stock marketplace. It supports both editorial and commercial licensing workflows and can
      be integrated into creative applications and DAM systems. The API uses OAuth 2.0 and API key authentication
      depending on the operation.
    image: https://www.adobe.com/content/dam/cc/icons/stock.svg
    humanURL: https://developer.adobe.com/stock/
