apis:
  - name: Adobe Photoshop API
    description: >-
      The Adobe Photoshop API provides programmatic access to Photoshop image manipulation capabilities including
      automated editing, masking, and compositing. It enables developers to integrate Photoshop processing into
      workflows and applications without requiring a desktop installation. The API supports common Photoshop operations
      such as layer manipulation, smart object editing, and image transformation.
    image: https://www.adobe.com/content/dam/cc/icons/photoshop.svg
    humanURL: https://developer.adobe.com/photoshop/
    baseURL: https://image.adobe.io
    tags:
      - Automation
      - Graphics
      - Image Editing
      - Photoshop
    properties:
      - type: Documentation
        url: https://developer.adobe.com/photoshop/api/
      - type: OpenAPI
        url: https://developer.adobe.com/photoshop/api/openapi.json
      - type: OpenAPI
        url: openapi/adobe-creative-suite-photoshop-openapi.yml
      - type: JSONSchema
        url: json-schema/adobe-creative-suite-image-job-schema.json
      - type: Authentication
        url: https://developer.adobe.com/developer-console/docs/guides/authentication/
    contact:
      - FN: Adobe Developer Support
        url: https://developer.adobe.com/support/
    aid: adobe-creative-suite:photoshop-api
  - name: Adobe Lightroom API
    description: >-
      The Adobe Lightroom API provides access to photo management features including albums, collections, and editing
      presets stored in the Lightroom cloud catalog. Developers can use it to build integrations that read, organize,
      and manage photos on behalf of Lightroom users. The API uses OAuth 2.0 for user authentication and follows RESTful
      conventions.
    image: https://www.adobe.com/content/dam/cc/icons/lightroom.svg
    humanURL: https://developer.adobe.com/lightroom/
    baseURL: https://lr.adobe.io
    tags:
      - Editing
      - Lightroom
      - Photo Management
      - Photography
    properties:
      - type: Documentation
        url: https://developer.adobe.com/lightroom/api/
      - type: OpenAPI
        url: https://developer.adobe.com/lightroom/api/openapi.json
      - type: Authentication
        url: https://developer.adobe.com/developer-console/docs/guides/authentication/
    contact:
      - FN: Adobe Developer Support
        url: https://developer.adobe.com/support/
    aid: adobe-creative-suite:lightroom-api
  - name: Adobe Illustrator API
    description: >-
      The Adobe Illustrator API enables programmatic creation and manipulation of vector graphics through scripting and
      plugin interfaces. It exposes the Illustrator object model so developers can automate repetitive design tasks,
      generate artwork, and integrate Illustrator into production pipelines. The API is available via UXP plugins and
      CEP extensions as well as scripting environments.
    image: https://www.adobe.com/content/dam/cc/icons/illustrator.svg
    humanURL: https://developer.adobe.com/illustrator/
    baseURL: https://image.adobe.io
    tags:
      - Automation
      - Design
      - Illustrator
      - Vector Graphics
    properties:
      - type: Documentation
        url: https://developer.adobe.com/illustrator/api/
      - type: Authentication
        url: https://developer.adobe.com/developer-console/docs/guides/authentication/
    contact:
      - FN: Adobe Developer Support
        url: https://developer.adobe.com/support/
    aid: adobe-creative-suite:illustrator-api
  - name: Adobe InDesign API
    description: >-
      The Adobe InDesign API allows developers to automate document layout and publishing workflows through scripting
      and UXP plugins. It exposes InDesign's document model for tasks such as batch exporting, template population, and
      preflight automation. The API supports JavaScript, AppleScript, and VBScript as well as the newer UXP plugin
      architecture.
    image: https://www.adobe.com/content/dam/cc/icons/indesign.svg
    humanURL: https://developer.adobe.com/indesign/
    baseURL: https://indesign-api.adobe.io
    tags:
