- name: Adobe Analytics API
  description: >-
    The Adobe Analytics API provides programmatic access to Adobe Analytics report suites for retrieving,
    segmenting, and analyzing web and app behavioral data. It supports both the Reporting API for querying
    metrics and dimensions and the Data Insertion API for sending custom event data. The API is used to
    automate reporting, build custom dashboards, and integrate analytics data into external systems.
