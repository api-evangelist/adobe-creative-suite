  - name: Adobe UXP
    description: >-
      Adobe UXP (Unified Extensibility Platform) is the modern plugin and scripting platform used across Adobe creative
      applications including Photoshop, InDesign, Illustrator, and XD. It provides a JavaScript-based runtime with
      access to application APIs, a React-compatible UI framework, and a unified plugin distribution system via the
      Creative Cloud marketplace. UXP replaces the older CEP (Common Extensibility Platform) and ExtendScript plugin
      architectures.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://developer.adobe.com/uxp/
