- name: Adobe Premiere Pro API
  description: >-
    The Adobe Premiere Pro API gives developers access to video editing automation through scripting and
    panel extensions. It allows integration with external media asset management systems, automated sequence
    assembly, and custom export workflows. The API is accessible through CEP extensions and the UXP plugin
    framework.
