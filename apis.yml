  - name: Adobe Fonts API
    description: >-
      The Adobe Fonts API provides access to the Adobe Fonts library for discovering and embedding web fonts in
      applications and websites. It allows querying font families, retrieving font metadata, and generating web font
      embed codes for use with Creative Cloud subscriptions. The API is commonly used by design tools and CMSs to expose
      the Adobe Fonts catalog to users.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://fonts.adobe.com/
    baseURL: https://fonts.adobe.io
