  - name: Adobe After Effects API
    description: >-
      The Adobe After Effects API enables scripting and plugin development for motion graphics and visual effects
      workflows. Developers can automate rendering, manipulate compositions programmatically, and build custom effects
      using the SDK. The API supports ExtendScript, CEP panels, and the newer UXP and plugin SDK approaches.
    image: https://www.adobe.com/content/dam/cc/icons/after-effects.svg
    humanURL: https://developer.adobe.com/after-effects/
    baseURL: https://aftereffects-api.adobe.io
