  - name: Adobe Acrobat Sign API
    description: >-
      The Adobe Acrobat Sign API enables sending, tracking, and managing electronic signature agreements
      programmatically. It supports creating agreements from documents or templates, managing signers and routing, and
      retrieving signed documents and audit trails. The API is available in region-specific deployments and uses OAuth
      2.0 for authentication.
    image: https://www.adobe.com/content/dam/cc/icons/cc-icon.svg
    humanURL: https://developer.adobe.com/adobesign/docs/
    baseURL: https://api.na1.adobesign.com/api/rest/v6
