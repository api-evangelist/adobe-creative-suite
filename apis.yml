- name: Adobe After Effects API
  description: >-
    The Adobe After Effects API enables scripting and plugin development for motion graphics and visual
    effects workflows. Developers can automate rendering, manipulate compositions programmatically, and
    build custom effects using the SDK. The API supports ExtendScript, CEP panels, and the newer UXP and
    plugin SDK approaches.
