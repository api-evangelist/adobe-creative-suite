- name: Adobe Creative Cloud Libraries API
  description: >-
    The Adobe Creative Cloud Libraries API provides access to shared design assets stored in Creative
    Cloud Libraries, including colors, character styles, graphics, and components. It allows applications
    to read and write library elements on behalf of authenticated users. The API is commonly used to sync
    brand assets across design tools and third-party platforms.
